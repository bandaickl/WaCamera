name: Build WaCamera
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Save Java 17 path
        shell: pwsh
        run: '"JAVA17_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Save Java 21 path
        shell: pwsh
        run: '"JAVA21_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV'
      - name: Test common code and build both Java-only mod packages
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: wacamera-mods
          path: dist/*.jar
