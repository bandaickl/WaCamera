plugins { id 'java-library' }
group = 'dev.wacamera'
version = '1.0.4'
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    // Minecraft already provides these: compile against the older supported runtime, do not bundle.
    compileOnly 'net.java.dev.jna:jna:5.12.1'
    compileOnly 'net.java.dev.jna:jna-platform:5.12.1'
    testImplementation 'net.java.dev.jna:jna:5.12.1'
    testImplementation 'net.java.dev.jna:jna-platform:5.12.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(Test).configureEach { useJUnitPlatform() }
if (rootProject.name != 'wacamera') layout.buildDirectory = rootProject.layout.buildDirectory.dir('shared/recorder')
